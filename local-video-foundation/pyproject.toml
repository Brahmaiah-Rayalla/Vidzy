[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-video-foundation"
version = "0.1.0"
description = "Stage 1: Unconditional Image Generation with Diffusion Models"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "torchvision>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
generate-dataset = "video_foundation.data.synthetic:main"
train-image = "video_foundation.training.train_image:main"
sample-image = "video_foundation.inference.sample_image:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["video_foundation*"]
