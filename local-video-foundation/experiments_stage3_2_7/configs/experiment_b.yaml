# Experiment B: Temporal Fusion Only
# Original vocabulary, temporal modules enabled

experiment:
  name: "experiment_b_temporal_fusion"
  type: "B"
  description: "Temporal fusion only - original vocabulary"

model:
  num_frames: 16
  image_size: 64
  temporal_kernel: 3
  temporal_layers: 2
  freeze_spatial: true
  use_temporal: true
  enable_temporal_processing: true

data:
  data_dir: "data_synthetic"
  batch_size: 1
  num_workers: 0

training:
  num_steps: 50
  learning_rate: 0.0001
  num_timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02
  max_seq_len: 64
  save_every: 25
  val_every: 25

checkpoints:
  checkpoint_dir: "checkpoints_experiments"
  spatial_checkpoint: "checkpoints/checkpoint_stage2_motion_expanded.pt"
  text_encoder_checkpoint: "checkpoints/checkpoint_stage2_motion_expanded.pt"
  tokenizer_path: "checkpoints/tokenizer_motion_expanded.json"

device: "cpu"
