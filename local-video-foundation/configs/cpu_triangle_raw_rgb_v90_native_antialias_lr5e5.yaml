model:
  num_classes: 3
  num_color_classes: 4
  num_size_classes: 3
  spatial_size_conditioning: true
  image_size: 128
  in_channels: 3
  model_channels: 16
  channel_mult: [1, 2, 2]
  attention_resolutions: []
  num_res_blocks: 1
  dropout: 0.0
  size_embedding_scale: 1.0
  middle_dilation: 2
  high_resolution_refinement: false
diffusion:
  num_timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02
  beta_schedule: linear
  prediction_type: v_prediction
training:
  num_steps: 5000
  batch_size: 4
  learning_rate: 0.00005
  weight_decay: 0.0
  seed: 70090
  cpu_threads: 4
  save_interval: 1000
  log_interval: 20
  sample_interval: 1000
  structure_loss_weight: 0.3
  structure_area_weight: 0.25
  position_augmentation_pixels: 0
  ema_decay: 0.99
  foreground_weight: 3.0
  foreground_x0_weight: 0.5
  triangle_background_x0_weight: 0.5
  triangle_edge_weight: 0.1
  triangle_silhouette_weight: 0.2
  triangle_boundary_weight: 0.2
  triangle_centroid_weight: 0.01
  balance_condition_combinations: true
  sample_count: 4
  sample_shape_id: 2
  sample_color_ids: [0, 1, 2, 3]
  sample_size_id: 2
dataset:
  image_size: 128
  cache_in_memory: true
inference:
  num_samples: 4
  sampling_steps: 50
  seed: 5678
