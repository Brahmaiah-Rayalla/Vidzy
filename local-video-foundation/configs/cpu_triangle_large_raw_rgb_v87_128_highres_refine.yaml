model:
  num_classes: 3
  num_color_classes: 4
  num_size_classes: 3
  spatial_size_conditioning: true
  image_size: 128
  in_channels: 3
  model_channels: 16
  channel_mult: [1, 2, 2]
  attention_resolutions: []
  num_res_blocks: 1
  dropout: 0.0
  size_embedding_scale: 1.0
  high_resolution_refinement: true
diffusion:
  num_timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02
  beta_schedule: linear
  prediction_type: v_prediction
training:
  num_steps: 1000
  batch_size: 4
  learning_rate: 0.0000005
  weight_decay: 0.0
  seed: 70087
  cpu_threads: 4
  save_interval: 250
  log_interval: 20
  sample_interval: 500
  structure_loss_weight: 0.3
  structure_area_weight: 0.25
  position_augmentation_pixels: 0
  ema_decay: 0.99
  foreground_weight: 0.1
  foreground_x0_weight: 0.25
  triangle_background_x0_weight: 0.25
  triangle_edge_weight: 0.1
  triangle_silhouette_weight: 0.15
  triangle_boundary_weight: 0.1
  triangle_centroid_weight: 0.01
  balance_condition_combinations: true
dataset:
  image_size: 128
  cache_in_memory: true
inference:
  num_samples: 4
  sampling_steps: 24
  seed: 2345
